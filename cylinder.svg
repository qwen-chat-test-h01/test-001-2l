<svg width="300" height="400" viewBox="0 0 300 400" xmlns="http://www.w3.org/2000/svg">
  <!-- 圆柱体参数 -->
  <defs>
    <!-- 渐变效果 -->
    <linearGradient id="cylinderGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#87CEEB;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#4682B4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1E90FF;stop-opacity:1" />
    </linearGradient>
    
    <!-- 阴影效果 -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="2" dy="2" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.3"/>
      </feComponentTransfer>
      <feMerge> 
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/> 
      </feMerge>
    </filter>
  </defs>
  
  <!-- 圆柱体主体 -->
  <g filter="url(#shadow)">
    <!-- 顶部椭圆 -->
    <ellipse cx="150" cy="80" rx="80" ry="25" fill="url(#cylinderGradient)" opacity="0.9"/>
    
    <!-- 圆柱侧面 -->
    <rect x="70" y="80" width="160" height="250" fill="url(#cylinderGradient)" opacity="0.8"/>
    
    <!-- 底部椭圆 -->
    <ellipse cx="150" cy="330" rx="80" ry="25" fill="url(#cylinderGradient)" opacity="0.85"/>
    
    <!-- 高光效果 -->
    <ellipse cx="150" cy="80" rx="75" ry="22" fill="white" opacity="0.2"/>
    <rect x="75" y="80" width="10" height="250" fill="white" opacity="0.15"/>
  </g>
  
  <!-- 边框 -->
  <ellipse cx="150" cy="80" rx="80" ry="25" fill="none" stroke="#4682B4" stroke-width="2"/>
  <ellipse cx="150" cy="330" rx="80" ry="25" fill="none" stroke="#4682B4" stroke-width="2"/>
  <line x1="70" y1="80" x2="70" y2="330" stroke="#4682B4" stroke-width="2"/>
  <line x1="230" y1="80" x2="230" y2="330" stroke="#4682B4" stroke-width="2"/>
</svg>