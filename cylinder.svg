<svg width="300" height="400" viewBox="0 0 300 400" xmlns="http://www.w3.org/2000/svg">
  <!-- 定义渐变 -->
  <defs>
    <!-- 侧面渐变 -->
    <linearGradient id="sideGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#666;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#ccc;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#666;stop-opacity:1" />
    </linearGradient>
    
    <!-- 顶部渐变 -->
    <radialGradient id="topGradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#eee;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#999;stop-opacity:1" />
    </radialGradient>
  </defs>
  
  <!-- 圆柱体侧面 -->
  <rect x="100" y="100" width="100" height="200" fill="url(#sideGradient)" />
  
  <!-- 圆柱体顶部椭圆 -->
  <ellipse cx="150" cy="100" rx="50" ry="20" fill="url(#topGradient)" stroke="#888" stroke-width="1"/>
  
  <!-- 圆柱体底部椭圆（只绘制可见部分） -->
  <ellipse cx="150" cy="300" rx="50" ry="20" fill="none" stroke="#888" stroke-width="1"/>
  
  <!-- 添加高光线增强立体感 -->
  <path d="M 120 100 L 120 300" stroke="rgba(255,255,255,0.3)" stroke-width="2" fill="none"/>
</svg>
